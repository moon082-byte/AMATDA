# 텔레그램 알림봇(bot/) 코드가 바뀌면 단위 테스트를 돌린다
name: Bot test

on:
  push:
    branches: [main]
    paths: ['bot/**']
  pull_request:
    paths: ['bot/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 테스트가 Node 내장 SQLite(node:sqlite)를 쓴다
      - run: npm test
