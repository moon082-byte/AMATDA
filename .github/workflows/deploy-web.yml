# main 브랜치에 push되면 Flutter 웹앱을 빌드해 GitHub Pages에 배포한다.
# 배포 주소: https://<계정>.github.io/<저장소 이름>/
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 push해도 마지막 배포만 진행한다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=BUILD_ID=${{ github.sha }}

      # 새 버전 감지·캐시 우회: 앱은 build.json의 빌드 번호가 자기와 다르면 [새로고침]을 띄우고,
      # 앱 파일 주소에 빌드 번호를 붙여 텔레그램 미니앱·홈 화면 앱이 예전 파일을 쓰지 않게 한다
      - name: Stamp build
        run: |
          echo "{\"build\":\"${GITHUB_SHA}\"}" > build/web/build.json
          sed -i "s#\"mainJsPath\":\"main.dart.js\"#\"mainJsPath\":\"main.dart.js?v=${GITHUB_SHA}\"#" build/web/flutter_bootstrap.js
          sed -i "s#src=\"flutter_bootstrap.js\"#src=\"flutter_bootstrap.js?v=${GITHUB_SHA}\"#" build/web/index.html
          grep -q "main.dart.js?v=${GITHUB_SHA}" build/web/flutter_bootstrap.js
          grep -q "flutter_bootstrap.js?v=${GITHUB_SHA}" build/web/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
