<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    배포 경로(예: GitHub Pages의 /AMATDA/)는 `flutter build web --base-href`
    값으로 아래 자리표시자가 바뀐다. 경로는 슬래시로 시작하고 끝나야 한다.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="텔레그램 업무방과 연결해 할 일과 마감을 챙겨 주는 업무 리마인더">
  <meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17171C" media="(prefers-color-scheme: dark)">

  <!-- iOS 홈 화면 추가용 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="아맞다">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>아맞다</title>

  <!-- 텔레그램 알림의 [앱에서 보기](미니앱)로 열렸을 때만 텔레그램 스크립트를 불러와 화면을 꽉 채운다.
       로그인은 주소의 #tgWebAppData(텔레그램이 서명한 사용자 정보)로 앱이 직접 처리한다. -->
  <script>
    // 앱이 주소를 정리하기 전에 텔레그램 스크립트가 #tgWebAppData를 읽도록 바로(동기) 불러온다
    if (location.hash.indexOf('tgWebAppData=') !== -1) {
      document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
    }
  </script>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
  <link rel="manifest" href="manifest.json">

  <style>
    :root { --bg: #F2F4F6; --text: #8B95A1; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17171C; --text: #8B95A1; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    /* Flutter가 첫 화면을 그리기 전까지 보여주는 로딩 화면 */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: var(--bg); transition: opacity .25s ease;
    }
    #splash img { width: 128px; height: 128px; border-radius: 28px; animation: pulse 1.4s ease-in-out infinite; }
    #splash p {
      margin: 0; color: var(--text); font-size: 17px; font-weight: 600;
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .8; } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <p>아맞다 불러오는 중…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      // 안드로이드 크롬: 키보드가 올라오면 화면 높이를 줄여 입력칸이 가려지지 않게 한다.
      // (Flutter가 viewport 태그를 직접 만들기 때문에 첫 화면이 뜬 뒤에 덧붙인다)
      var viewport = document.querySelector('meta[name=viewport]');
      if (viewport && viewport.content.indexOf('interactive-widget') === -1) {
        viewport.content += ', interactive-widget=resizes-content';
      }
      // 아이폰 Safari: 입력칸이 키보드에 가려지면 Safari가 페이지 전체를 위로 밀어 올린다.
      // 입력칸은 앱이 직접 키보드 위로 맞추므로, 밀린 페이지는 원래 위치로 되돌린다.
      if (window.visualViewport && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
        var resetPan = function () {
          if (window.scrollY !== 0 || window.visualViewport.offsetTop !== 0) window.scrollTo(0, 0);
        };
        window.visualViewport.addEventListener('scroll', resetPan);
        window.visualViewport.addEventListener('resize', resetPan);
      }
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="notify.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
