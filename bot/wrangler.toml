# 아맞다 텔레그램 알림봇 - Cloudflare Workers 설정 (설치 방법은 README.md 참고)
name = "amatda-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

# https://amatda-bot.<하위 도메인>.workers.dev 주소로 공개하고, 버전별 미리보기 주소는 만들지 않는다
workers_dev = true
preview_urls = false

# 1분마다 보낼 알림이 있는지 확인한다
[triggers]
crons = ["* * * * *"]

# 앱(GitHub Pages)에서만 봇 서버를 호출할 수 있게 한다
[vars]
ALLOWED_ORIGINS = "https://moon082-byte.github.io"

# `npx wrangler d1 create amatda-bot`으로 만든 데이터베이스
[[d1_databases]]
binding = "DB"
database_name = "amatda-bot"
database_id = "8e78042c-ca97-457d-a00c-37effc983fd7"
